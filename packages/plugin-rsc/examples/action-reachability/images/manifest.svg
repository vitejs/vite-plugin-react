<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="820" height="400" fill="#fff"/>

  <!-- RSC build -->
  <rect x="20" y="20" width="320" height="230" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="36" y="44" font-weight="600">1. RSC build graph from route /a roots</text>
  <rect x="50" y="64" width="240" height="32" rx="4" fill="#fff" stroke="#999"/>
  <text x="62" y="85">root.tsx, a/page.tsx</text>
  <line x1="170" y1="96" x2="170" y2="128" stroke="#555" marker-end="url(#arr)"/>
  <rect x="50" y="130" width="240" height="44" rx="4" fill="#fff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="62" y="149">a/client.tsx</text>
  <text x="62" y="166" fill="#666" font-size="12">client reference proxy, graph stops here</text>
  <text x="36" y="204" fill="#666" font-size="12">collects: server reference IDs imported directly</text>
  <text x="36" y="222" fill="#666" font-size="12">(none for /a) and client reference import IDs</text>

  <!-- Client build -->
  <rect x="480" y="20" width="320" height="230" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="496" y="44" font-weight="600">2. Client build graph from those imports</text>
  <rect x="510" y="64" width="240" height="32" rx="4" fill="#fff" stroke="#999"/>
  <text x="522" y="85">a/client.tsx ("use client")</text>
  <line x1="630" y1="96" x2="630" y2="112" stroke="#555" marker-end="url(#arr)"/>
  <rect x="510" y="114" width="240" height="32" rx="4" fill="#fff" stroke="#999"/>
  <text x="522" y="135">a/action-indirect.ts</text>
  <line x1="630" y1="146" x2="630" y2="162" stroke="#555" marker-end="url(#arr)"/>
  <rect x="510" y="164" width="240" height="44" rx="4" fill="#fff" stroke="#999"/>
  <text x="522" y="183">a/action.tsx ("use server")</text>
  <text x="522" y="200" fill="#666" font-size="12">server reference proxy: actionA</text>
  <text x="496" y="234" fill="#666" font-size="12">the action edge exists only in this graph</text>

  <path d="M290,152 C390,152 400,80 508,80" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="330" y="108" fill="#2563eb" font-size="12">client reference</text>
  <text x="330" y="123" fill="#2563eb" font-size="12">import ID</text>

  <!-- Manifest -->
  <line x1="410" y1="250" x2="410" y2="278" stroke="#555" marker-end="url(#arr)"/>
  <text x="420" y="268" fill="#666" font-size="12">union per route, written after both builds</text>
  <rect x="60" y="282" width="700" height="104" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="76" y="304" font-weight="600">__route_action_manifest.js (build output)</text>
  <g font-family="ui-monospace, monospace" font-size="12">
    <text x="76" y="326">/a  598f…#actionA</text>
    <text x="76" y="346">/b  55d4…#actionB  55d4…#actionBWithCallback  b3ee…#sharedProgressiveAction</text>
    <text x="76" y="366">/c  9560…#progressiveActionC  9560…#boundProgressiveActionC  b3ee…#sharedProgressiveAction</text>
  </g>
</svg>
