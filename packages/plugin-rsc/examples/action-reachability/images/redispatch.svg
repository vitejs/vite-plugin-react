<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="820" height="400" fill="#fff"/>

  <!-- Browser -->
  <rect x="20" y="20" width="200" height="130" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="36" y="44" font-weight="600">Browser on /b</text>
  <text x="36" y="66" font-size="12">saved actionA from /a</text>
  <text x="36" y="84" font-size="12">clicks "Run saved action"</text>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#333">
    <text x="36" y="112">POST /b_.rsc</text>
    <text x="36" y="128">x-rsc-action: actionA</text>
  </g>
  <line x1="220" y1="85" x2="258" y2="85" stroke="#555" marker-end="url(#arr)"/>

  <!-- handler /b -->
  <rect x="260" y="20" width="540" height="300" rx="8" fill="#fafafa" stroke="#999"/>
  <text x="276" y="44" font-weight="600">handler: /b middleware (MIDDLEWARE_B)</text>
  <text x="276" y="68">routeActionRequest: manifest lists actionA under /a, not /b</text>
  <text x="276" y="88" fill="#666" font-size="12">→ redispatch, a new request built from the same body</text>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#333">
    <text x="296" y="110">POST /a_.rsc   x-action-forwarded: 1   x-rsc-render-url: /b</text>
  </g>

  <!-- handler /a nested -->
  <rect x="290" y="126" width="490" height="178" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="306" y="150" font-weight="600">handler: /a middleware (MIDDLEWARE_A)</text>
  <text x="306" y="174">routeActionRequest: actionA is under /a → continue</text>
  <text x="306" y="196">decodeReply → loadServerAction → actionA()</text>
  <text x="306" y="218" fill="#15803d" font-family="ui-monospace, monospace" font-size="12">returns ACTION_A_OK:MIDDLEWARE_A</text>
  <text x="306" y="246">renders RouteRoot for render URL /b</text>
  <text x="306" y="266" fill="#666" font-size="12">so the response keeps showing page B</text>
  <text x="306" y="290" fill="#666" font-size="12">a second redispatch is refused: forwarded + wrong route → 404</text>

  <!-- legend -->
  <text x="20" y="352" font-weight="600">routeActionRequest outcomes</text>
  <text x="20" y="374" font-size="12">continue: the current route reaches the ID, or no manifest (dev)</text>
  <text x="400" y="374" font-size="12">redispatch: another route reaches the ID</text>
  <text x="20" y="392" font-size="12">reject 404: no route reaches the ID, or the request was already forwarded</text>
</svg>
