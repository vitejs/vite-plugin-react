<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>

  <text x="160" y="26" text-anchor="middle" font-weight="bold">RSC environment (encode)</text>
  <text x="445" y="26" text-anchor="middle" font-weight="bold">on the wire</text>
  <text x="725" y="26" text-anchor="middle" font-weight="bold">decode side</text>

  <!-- client reference row -->
  <text x="20" y="54" font-weight="bold" fill="#1f5fa8">Client reference</text>
  <rect x="20" y="64" width="280" height="88" rx="6" fill="#eef4fb" stroke="#1f5fa8"/>
  <text x="32" y="86" font-family="ui-monospace, monospace">renderToReadableStream</text>
  <text x="32" y="108">client manifest maps $$id to</text>
  <text x="32" y="126" font-family="ui-monospace, monospace">{ id: key + $$cache=N, name }</text>
  <text x="32" y="144" fill="#555">(the tag is added in dev only)</text>

  <line x1="300" y1="108" x2="328" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="64" width="230" height="88" rx="6" fill="#fff8e6" stroke="#b07d00"/>
  <text x="342" y="86" font-family="ui-monospace, monospace" font-size="12">I["key$$cache=N", [], "name"]</text>
  <text x="342" y="112">the manifest output</text>
  <text x="342" y="130">is serialized as is</text>

  <line x1="560" y1="108" x2="588" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="590" y="64" width="270" height="88" rx="6" fill="#eef4fb" stroke="#1f5fa8"/>
  <text x="602" y="86">SSR or browser</text>
  <text x="602" y="104" font-family="ui-monospace, monospace">createFromReadableStream</text>
  <text x="602" y="124">uses the metadata id as load id,</text>
  <text x="602" y="142">and the client require strips the tag</text>

  <!-- server reference row -->
  <text x="20" y="190" font-weight="bold" fill="#2e7d32">Server reference</text>
  <rect x="20" y="200" width="280" height="110" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="32" y="222" font-family="ui-monospace, monospace">renderToReadableStream</text>
  <text x="32" y="244">serializes the function's own</text>
  <text x="32" y="262" font-family="ui-monospace, monospace">$$id = "key#name"</text>
  <text x="32" y="284">with no manifest</text>

  <line x1="300" y1="255" x2="328" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="200" width="230" height="110" rx="6" fill="#fff8e6" stroke="#b07d00"/>
  <text x="342" y="222" font-family="ui-monospace, monospace">{ id: "key#name", bound }</text>
  <text x="342" y="248">a raw id with no markers,</text>
  <text x="342" y="266">which the client sends back</text>
  <text x="342" y="284">in a reply or a form post</text>

  <line x1="560" y1="255" x2="588" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="590" y="200" width="270" height="110" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="602" y="222">RSC</text>
  <text x="634" y="222" font-family="ui-monospace, monospace">decodeReply / decodeAction</text>
  <text x="602" y="244">server manifest maps "key#name" to</text>
  <text x="602" y="262" font-family="ui-monospace, monospace">$$server:key$$cache=N</text>
  <text x="602" y="284">which only goes to the require,</text>
  <text x="602" y="302">so it never leaves the server</text>
</svg>
