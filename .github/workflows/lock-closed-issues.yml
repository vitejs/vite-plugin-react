name: Lock Closed Issues

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write

jobs:
  action:
    if: github.repository == 'vitejs/vite-plugin-react'
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/issues-helper
        with:
          actions: lock-closed-issues
          token: ${{ secrets.GITHUB_TOKEN }}
          inactive-day: 14
